<!doctype html>
<html lang="es" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- frame-ancestors NO va aquí: en un <meta> el navegador la ignora y además
     deja un error en la consola en cada apertura. Va como cabecera de verdad,
     en app/_headers, junto con X-Frame-Options. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Meta</title>
<meta name="description" content="Tu espacio académico: hoy, horario, tareas, exámenes, apuntes y estudio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meta">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icono-180.png">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/app.css">
<!-- El ?v= NO es decorativo: el service worker de la versión anterior manda a
     la red todo lo que lleve query, así que este archivo siempre es el nuevo
     aunque el resto esté cacheado. Es lo que evita quedarse con el HTML nuevo
     y el JavaScript viejo. Lo reescribe tools/publica.sh. -->
<script src="./arranque.js?v=2.0.23"></script>
<!-- shell.js va aquí y es síncrono a propósito: además de ser la lista de
     archivos de la app, deja puesto el tema antes del primer pintado, así no
     hay un fogonazo blanco al abrir en modo oscuro. -->
<script src="./shell.js"></script>
</head>
<body>

<!-- ------------------------------------------------------------------------
     ARRANQUE: mientras se pregunta al servidor quién eres. Ni la app ni la
     pantalla de acceso deben aparecer antes de saberlo, o se vería un
     parpadeo de "entra" a alguien que ya tenía la sesión abierta.
     ------------------------------------------------------------------- -->
<div class="cargando" id="arranque">
  <div class="giro"></div>
</div>

<!-- ------------------------------- ACCESO ------------------------------- -->
<div class="acceso oculto" id="acceso">
  <div class="acceso-panel">
    <div class="acceso-caja" id="acceso-caja"></div>
  </div>
  <div class="acceso-muestra" aria-hidden="true">
    <div class="muestra-marco" id="acceso-muestra"></div>
  </div>
</div>

<!-- --------------------------------- APP -------------------------------- -->
<div class="app oculto" id="app">

  <aside class="lateral">
    <div class="marca"><i></i>Meta</div>

    <nav class="nav-grupo" aria-label="Principal">
      <button class="nav-item" data-accion="ir" data-id="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        Hoy <span class="nav-punto oculto" data-globo="hoy" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-accion="ir" data-id="horario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Horario
      </button>
      <button class="nav-item" data-accion="ir" data-id="tareas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        Tareas <span class="globo oculto" data-globo="tareas"></span>
      </button>
      <button class="nav-item" data-accion="ir" data-id="examenes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h4"/></svg>
        Exámenes <span class="globo oculto" data-globo="examenes"></span>
      </button>
    </nav>

    <nav class="nav-grupo" aria-label="Estudio">
      <div class="nav-et">Estudio</div>
      <button class="nav-item" data-accion="ir" data-id="estudiar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        Estudiar
      </button>
      <button class="nav-item" data-accion="ir" data-id="apuntes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3z"/></svg>
        Apuntes
      </button>
      <button class="nav-item" data-accion="ir" data-id="asignaturas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Asignaturas
      </button>
    </nav>

    <nav class="nav-grupo" aria-label="Seguimiento">
      <div class="nav-et">Seguimiento</div>
      <button class="nav-item" data-accion="ir" data-id="analisis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>
        Análisis
      </button>
    </nav>

    <div class="lateral-pie">
      <button class="usuario-btn" data-accion="ir" data-id="perfil">
        <span class="avatar" id="avatar-lateral">·</span>
        <span class="quien">
          <span class="n" id="nombre-lateral">Mi cuenta</span>
          <span class="e" id="email-lateral"></span>
        </span>
      </button>
    </div>
  </aside>

  <div class="columna">
    <header class="barra">
      <h1 id="titulo-vista">Hoy</h1>
      <button class="btn-icono" data-accion="buscar-abrir" aria-label="Buscar" title="Buscar (⌘K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="btn-icono" data-accion="ia-abrir" aria-label="Preguntar a META AI" title="META AI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5 10.1 12.8 4.5 10.9 10.1 9z"/><path d="M18.5 16.5 19 18l1.5.5L19 19l-.5 1.5-.5-1.5L16.5 18l1.5-.5z"/></svg>
      </button>
      <button class="btn-icono fuerte" data-accion="captura-abrir" aria-label="Crear" title="Crear (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main class="principal" id="principal">
      <section id="v-hoy"        class="vista"></section>
      <section id="v-horario"    class="vista oculto"></section>
      <section id="v-tareas"     class="vista oculto"></section>
      <section id="v-examenes"   class="vista oculto"></section>
      <section id="v-estudiar"   class="vista oculto"></section>
      <section id="v-apuntes"    class="vista oculto"></section>
      <section id="v-asignaturas" class="vista oculto"></section>
      <section id="v-analisis"   class="vista oculto"></section>
      <section id="v-perfil"     class="vista oculto"></section>
    </main>

    <nav class="inferior" aria-label="Secciones">
      <button class="inf-item" data-accion="ir" data-id="hoy">
        <span class="inf-icono-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
          <span class="inf-punto oculto" data-globo-punto="hoy"></span>
        </span>
        Hoy
      </button>
      <button class="inf-item" data-accion="ir" data-id="horario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Horario
      </button>
      <button class="inf-item" data-accion="ir" data-id="tareas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        Tareas
      </button>
      <button class="inf-item" data-accion="captura-abrir" aria-label="Crear">
        <span class="inf-mas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
      </button>
      <button class="inf-item" data-accion="mas-abrir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        Más
      </button>
    </nav>
  </div>

</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
